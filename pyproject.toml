[project]
name = "statistik-austria-mcp"
version = "1.0.0"
description = "MCP server that gives AI assistants access to Statistik Austria's open data portal"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Daniil Vasilcovschii", email = "dan.vasilkovskiy@gmail.com" }
]
keywords = ["mcp", "model-context-protocol", "statistik-austria", "open-data", "ogd", "austria"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.13"
dependencies = [
    "cachetools>=7.2.4",
    "httpx2>=2.12.0",
    "mcp>=2.1.1,<3",
    "pandas>=3.0.6",
]

[project.urls]
Repository = "https://github.com/DV155/Statistik-Austria-MCP-Server"
Issues = "https://github.com/DV155/Statistik-Austria-MCP-Server/issues"

[project.scripts]
statistik-austria-mcp = "statserver.server:main"

[dependency-groups]
dev = [
    "mcp[cli]>=2.1.1,<3",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "statserver"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true